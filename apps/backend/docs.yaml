info:
  title: ClinicFlow API
  description: ClinicFlow backend API documentation
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ObjectId:
      type: object
      properties: {}
    RegisterDto:
      type: object
      properties:
        phone:
          type: string
          example: '01712345678'
          description: Phone number of the user
          _propertyName: phone
        email:
          type: string
          example: example@gmail.com
          description: Email address of the user
          _propertyName: email
        password:
          type: string
          example: securePassword123
          description: Password for the user account
          _propertyName: password
        role:
          type: string
          enum:
            - USER
            - ADMIN
            - DOCTOR
            - PATIENT
            - STAFF
            - MERCHANT
            - SUPER_ADMIN
          description: Role of the user. Only PATIENT or MERCHANT allowed for signup
          _propertyName: role
        user:
          example: 652e0a823a37a1f8e82fdd4b
          description: Reference to existing user ID (if applicable)
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          _propertyName: user
        bloodGroup:
          type: string
          example: O+
          description: Blood group of the user
          _propertyName: bloodGroup
        emergencyContact:
          type: string
          example: '01787654321'
          description: Emergency contact phone number
          _propertyName: emergencyContact
        medicalHistory:
          type: string
          example: Diabetes, Hypertension
          description: Medical history or past health conditions
          _propertyName: medicalHistory
        currentMedications:
          example: *ref_367
          description: List of current medications
          type: array
          items:
            type: string
          _propertyName: currentMedications
        lastVisited:
          format: date-time
          type: string
          description: Date when the patient last visited the clinic
          example: '2025-02-15T00:00:00.000Z'
          _propertyName: lastVisited
        clinicName:
          type: string
          description: Profile ID associated with the merchant
          example: 652fcf2c4f2b09a4b5a4c2a8
          _propertyName: clinicName
        clinicAddress:
          type: string
          description: Address of the clinic
          example: 'House #12, Road #5, Rajshahi, Bangladesh'
          _propertyName: clinicAddress
        licenseNumber:
          type: string
          description: Clinic license or registration number
          example: LIC-2025-0345
          _propertyName: licenseNumber
        subscriptionStartDate:
          type: string
          description: Date when the subscription started
          example: '2025-01-01T00:00:00.000Z'
          _propertyName: subscriptionStartDate
        subscriptionEndDate:
          type: string
          description: Date when the subscription will end
          example: '2026-01-01T00:00:00.000Z'
          _propertyName: subscriptionEndDate
        numberOfBeds:
          type: number
          description: Current status of the subscription
          example: active
          _propertyName: numberOfBeds
        servicesOffered:
          description: List of services offered by the clinic
          example: *ref_368
          type: array
          items:
            type: string
          _propertyName: servicesOffered
        merchant:
          type: string
          description: Associated merchant/tenant ID
          _propertyName: merchant
        clinic:
          type: string
          description: Associated clinic branch ID
          _propertyName: clinic
        subdomain:
          type: string
          description: Subdomain for tenant
          _propertyName: subdomain
        domain:
          type: string
          description: Domain for tenant
          _propertyName: domain
        customDomain:
          type: string
          description: Custom domain for tenant
          _propertyName: customDomain
        clinicLogo:
          type: string
          description: Logo URL for clinic
          _propertyName: clinicLogo
        specialization:
          description: Specializations of doctor
          type: array
          items:
            type: string
          _propertyName: specialization
        designation:
          type: string
          description: Designation of doctor
          _propertyName: designation
        experienceInYears:
          type: number
          description: Experience in years
          _propertyName: experienceInYears
        fee:
          type: number
          description: Consultation fee
          _propertyName: fee
        degree:
          description: Degrees of doctor
          type: array
          items:
            type: string
          _propertyName: degree
        languages:
          description: Languages spoken
          type: array
          items:
            type: string
          _propertyName: languages
        status:
          type: string
          description: Indicates if the merchant account is active
          example: ACTIVE
          _propertyName: status
      required:
        - phone
        - password
        - bloodGroup
        - clinicName
        - clinicAddress
        - licenseNumber
        - subscriptionStartDate
        - subscriptionEndDate
      example: *ref_1
    CreateUserDto:
      type: object
      properties: {}
      example: *ref_4
    CreateQuickPatientDto:
      type: object
      properties:
        name:
          type: string
          example: Md. Karim Rahman
          _propertyName: name
        phone:
          type: string
          example: '01712345678'
          _propertyName: phone
        gender:
          type: string
          example: MALE
          _propertyName: gender
        bloodGroup:
          type: string
          example: O+
          _propertyName: bloodGroup
        address:
          type: string
          example: Dhaka, Bangladesh
          _propertyName: address
        age:
          type: object
          example: '35'
          _propertyName: age
        emergencyContact:
          type: string
          example: '01812345678'
          _propertyName: emergencyContact
      required:
        - name
        - phone
      example: *ref_7
    UpdatePatientDto:
      type: object
      properties:
        user:
          description: User ID linked with this patient record
          example: 652fcf2c4f2b09a4b5a4c2a8
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          _propertyName: user
        merchant:
          description: Merchant ID linked with this patient record
          example: 652fcf2c4f2b09a4b5a4c2a8
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          _propertyName: merchant
        clinic:
          description: Clinic branch ID linked with this patient record
          example: 652fcf2c4f2b09a4b5a4c2a8
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          _propertyName: clinic
        bloodGroup:
          type: string
          description: Patient’s blood group
          example: O+
          _propertyName: bloodGroup
        emergencyContact:
          type: string
          description: Emergency contact number for the patient
          example: '+8801712345678'
          _propertyName: emergencyContact
        medicalHistory:
          type: string
          description: Brief medical history of the patient
          example: Diabetes, High Blood Pressure
          _propertyName: medicalHistory
        currentMedications:
          description: List of current medications the patient is taking
          example: *ref_369
          type: array
          items:
            type: string
          _propertyName: currentMedications
        lastVisited:
          format: date-time
          type: string
          description: Date when the patient last visited the clinic
          example: '2025-02-15T00:00:00.000Z'
          _propertyName: lastVisited
      example: *ref_14
    CreateMedicalRecordDto:
      type: object
      properties:
        patientId:
          type: string
          description: Patient ID linked to this medical record
          example: 652fcf2c4f2b09a4b5a4c2a8
          _propertyName: patientId
        doctorId:
          type: string
          description: Doctor ID responsible for this record
          example: 652f9f18c1b2a4a7b8f67890
          _propertyName: doctorId
        appointmentId:
          type: string
          description: Optional appointment ID for the consultation
          example: 6530a2c44cb2dbd2a1111111
          _propertyName: appointmentId
        date:
          type: string
          description: Medical record date in ISO format
          example: '2025-10-20T10:30:00.000Z'
          _propertyName: date
        diagnosis:
          type: string
          description: Diagnosis or clinical assessment
          example: Mild hypertension
          _propertyName: diagnosis
        prescription:
          description: List of prescribed medicines or instructions
          example: *ref_370
          type: array
          items:
            type: string
          _propertyName: prescription
        notes:
          type: string
          description: Doctor notes
          example: Reduce sodium intake and monitor BP twice a week.
          _propertyName: notes
        followUpDate:
          type: string
          description: Follow-up date in ISO format
          example: '2025-11-20T10:30:00.000Z'
          _propertyName: followUpDate
        recordedBy:
          type: string
          description: User who recorded the record
          example: 652e0a823a37a1f8e82fdd4b
