          type: string
          description: Profile ID associated with the merchant
          example: 652fcf2c4f2b09a4b5a4c2a8
          _propertyName: clinicName
        clinicAddress:
          type: string
          description: Address of the clinic
          example: 'House #12, Road #5, Rajshahi, Bangladesh'
