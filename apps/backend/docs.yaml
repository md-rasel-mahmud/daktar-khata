        licenseNumber:
          type: string
          description: Clinic license or registration number
          example: LIC-2025-0345
          _propertyName: licenseNumber
        subscriptionStartDate:
          type: string
          description: Date when the subscription started
          example: '2025-01-01T00:00:00.000Z'
          _propertyName: subscriptionStartDate
        subscriptionEndDate:
          type: string
          description: Date when the subscription will end
          example: '2026-01-01T00:00:00.000Z'
          _propertyName: subscriptionEndDate
        numberOfBeds:
          type: number
          description: Current status of the subscription
